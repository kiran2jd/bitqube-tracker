name: BitQube Tracker

on:
  schedule:
    # NOTE: GitHub Actions cron is always UTC. IST = UTC+5:30.
    # 8:00 AM IST  == 2:30 AM UTC  -> earnings summary
    - cron: "30 2 * * *"
    # 10:00 PM IST == 4:30 PM UTC  -> earnings summary
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Show earnings over the last N hours (default 24)"
        required: false
        default: "24"

# So the workflow is allowed to commit the updated state file back to the repo
permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide which mode to run
        id: mode
        run: |
          # There are only two possible triggers now:
          #  - workflow_dispatch (you clicked "Run workflow")   -> on-demand check
          #  - schedule (8 AM or 10 PM IST, doesn't matter which) -> summary
          # No more time-of-day guessing, which was unreliable because
          # GitHub's cron can fire a few minutes late.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "flag=--last24h --hours=${{ github.event.inputs.hours }}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--summary" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tracker
        env:
          BITQUBE_ADDRESS: ${{ secrets.BITQUBE_ADDRESS }}
          BITQUBE_STATE_FILE: ${{ github.workspace }}/bitqube_state.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python3 bitqube_tracker.py ${{ steps.mode.outputs.flag }}

      - name: Commit updated state file
        run: |
          git config user.name "bitqube-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bitqube_state.json
          git diff --staged --quiet || git commit -m "Update BitQube tracker state [skip ci]"
          git push
